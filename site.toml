# 『My Cover』作品紹介ページの掲載内容。
# このファイルを書き換えて `python build.py` を実行するとサイトに反映されます。
# 「【要記入】」は未確定の項目です。確定したら書き換えてください。
#
# 画像について:
#   static/images/ に画像を置き、image = "static/images/ファイル名" のように指定します。
#   image = "" のままだと正方形のプレースホルダー枠が表示されます。
#   alt には画像の内容を説明する文章（代替テキスト）を必ず書いてください。

[site]
title = "My Cover"
subtitle = "音楽コンテンツにおけるオーディエンス・ジャーニーの設計"
page_title = "My Cover｜デザイン情報学科3年ゼミ展「滲む、響く。」"
description = "架空のアーティストの楽曲を聴き、感じたイメージを言葉にすると、生成AIがあなただけのCDジャケットを描き出す参加型展示『My Cover』の紹介ページです。"
lang = "ja"
url = "【要記入】"   # 公開URL（OGP用）。確定後に書き換え
placeholder = "【要記入】"

[hero]
# メインビジュアル（正方形）。未設定の間は「にじみ」のアニメーションを表示します。
