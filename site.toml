# 展示PRサイトの掲載内容。
# このファイルを書き換えて `python build.py` を実行するとサイトに反映されます。
# ※ 現在の内容はすべて仮のものです。実際の作品情報に差し替えてください。

[site]
title = "共鳴する光 ― Resonance ―"
subtitle = "触れると応える、光と音のインタラクティブ・インスタレーション"
description = "来場者の動きに光と音がリアルタイムに反応するインタラクション作品「共鳴する光」の展示情報サイトです。"
lang = "ja"

[artwork]
lead = "あなたが動くと、空間が応える。"
body = [
  "本作品は、来場者の位置や身振りをセンサーで捉え、無数の光の粒子と音響をリアルタイムに変化させるインスタレーションです。",
  "一人で静かに佇めば光はゆっくりと集まり、複数人で動けば粒子は互いに干渉しあい、二度と同じ形にはなりません。",
  "鑑賞者自身が作品の一部となる体験を通して、「見る」と「つくる」の境界を問いかけます。",
]
features = [
  { title = "リアルタイム反応", text = "深度センサーで来場者の動きを検知し、光と音が即座に変化します。" },
  { title = "多人数インタラクション", text = "複数の来場者の動きが重なり合い、予測できない表現が生まれます。" },
  { title = "立体音響", text = "空間に配置した8chスピーカーにより、音が光の粒子とともに移動します。" },
]

[exhibition]
period = "2027年3月1日（月）〜 3月14日（日）"
hours = "10:00 〜 19:00（最終入場 18:30）"
closed = "会期中無休"
admission = "無料（予約不要）"
venue = "〇〇ギャラリー 1F 展示室"
address = "東京都〇〇区〇〇 1-2-3"
access = [
  "〇〇線「〇〇駅」A1出口より徒歩5分",
  "〇〇線「〇〇駅」東口より徒歩8分",
]
map_url = ""   # Google マップ等の URL を入れると「地図を開く」ボタンが表示されます

[artist]
name = "山田 太郎（仮）"
role = "メディアアーティスト"
profile = "光・音・身体をテーマにインタラクティブな作品を制作。国内外の展覧会・フェスティバルに出展。"

[[news]]
date = "2026-11-19"
text = "展示情報サイトを公開しました。"

[[faq]]
q = "写真・動画の撮影はできますか？"
a = "はい、撮影可能です。フラッシュ・三脚のご使用はご遠慮ください。SNSへの投稿も歓迎します。"

[[faq]]
q = "子ども連れでも楽しめますか？"
a = "はい、お子さまにもお楽しみいただけます。展示室内はやや暗いため、足元にご注意ください。"

[[faq]]
q = "所要時間はどれくらいですか？"
a = "目安は15〜20分程度です。"

