# ---------------------------------------------------------------- About
[about]
lead = "同じ1曲を聴いても、思い浮かべる色や景色は人によって違う。"
body = [
  "架空のアーティストの楽曲を聴いた鑑賞者が、曲から感じたイメージを言葉にすると、生成AIがその言葉をもとに、その人だけのCDジャケットを描き出す参加型の展示です。",
  "会場の大型モニターには来場者が作ったジャケットが次々と映し出され、「同じ曲なのに、人によってこんなに違う」ことが目に見える形で並びます。",
]
artist = "【要記入】"   # 架空アーティストの名前
song = "【要記入】"     # 楽曲名

[[about.meanings]]
word = "Cover"
reading = "ジャケット"
text = "自分だけのジャケット（カバーアート）を作る。"

[[about.meanings]]
word = "Cover"
