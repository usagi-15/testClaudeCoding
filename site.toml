# ---------------------------------------------------------------- Experience
[[steps]]
en = "Listen"
title = "聴く"
text = "机の前に立ち、スピーカーから流れる架空アーティストの楽曲を聴く。"

[[steps]]
en = "Describe"
title = "言葉にする"
text = "曲から感じたイメージを言葉で入力する。"

[[steps]]
en = "Generate"
title = "生まれる"
text = "生成AIが、その言葉から自分だけのジャケットを生成する。"

[[steps]]
en = "Take home"
title = "持ち帰る"
text = "画面のQRコードからスマホに保存する／QRコード付きの番号入りカードを持ち帰る。"

[[steps]]
en = "Line up"
title = "並ぶ"
text = "作ったジャケットは、会場の大型モニターでスライドショーとして映し出される。"

[[steps]]
en = "Come back"
title = "戻ってくる"
text = "後日、カードのQRコードから自分専用のページに戻り、もう一度曲を聴ける。"
note = "自分専用ページのURL・公開方法：【要記入】"

# ---------------------------------------------------------------- Research
[research]
question = "楽曲への参加体験は、その曲を「自分のもの」と感じること（所有）や、もう一度聴きに戻ること（再鑑賞）につながるのか。"
body = [
  "CDジャケットのように「物として音楽を所有する」体験が薄れつつある今、楽曲への参加体験が所有や再鑑賞につながるのかを探ります。",
  "もともとの関心は「ジャケットの見た目で曲の印象がどう変わるか」でしたが、本作では問いを「参加体験が所有や再鑑賞につながるか」へと置き直し、展示の体験そのものを、楽曲と出会ってから再び戻ってくるまでのオーディエンス・ジャーニーとして設計しています。",
]
notice = "作ったジャケットは会場で表示され、入力内容やアクセス記録は個人を特定しない形で研究に使用します。"

# ---------------------------------------------------------------- System
[system]
flow = ["鑑賞者の言葉", "固定プロンプトと結合", "Flask アプリ", "GPT Image で生成", "Pillow でタイトルを合成", "QRで保存／大型モニターに表示"]
points = [
  "鑑賞者の入力を、曲のコンセプト・イメージ・ルールをまとめた固定のプロンプトと組み合わせ、Python（Flask）のアプリ経由でOpenAIの画像生成（GPT Image）に送信します。",
  "ジャケットのサイズとタイトルは固定。タイトルは生成後に画像処理（Pillow）で重ねます。",
  "生成されたジャケットはQRコードで来場者のスマホに保存できます。",
  "会場ではWindows PC上でアプリを動かし、操作画面とは別に大型モニターへスライドショーを表示します。",
  "開発にはClaude Codeを使用しました。",
]

